<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priya Marwaha — Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montagu+Slab:wght@200..700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%}
    body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:auto}
    main{width:min(1100px,90vw);min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:8vh 0}
    h1{font-family:"Montagu Slab",Georgia,serif;font-size:clamp(4rem,12vw,11rem);line-height:.86;letter-spacing:-.055em;font-weight:350;max-width:1000px;opacity:0;transform:translateY(28px) scale(.985);animation:titleIn 1000ms cubic-bezier(.16,1,.3,1) 120ms forwards}
    .name-letter{display:inline-block;position:relative;user-select:none;-webkit-user-select:none;white-space:pre}
    .name-letter .pixel-letter{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .bio{max-width:680px;margin-top:2.5rem;font-size:clamp(1rem,1.5vw,1.25rem);line-height:1.5;color:#fff;opacity:0;transform:translateY(18px);animation:fadeUp 800ms cubic-bezier(.16,1,.3,1) 420ms forwards}
    .portfolio{display:inline-flex;align-items:center;gap:.85rem;width:fit-content;margin-top:4.5rem;color:#fff;text-decoration:none;font-size:clamp(1.2rem,2vw,1.65rem);font-weight:600;letter-spacing:.015em;border-bottom:1px solid rgba(255,255,255,.8);padding:.2rem 0 .6rem;opacity:0;transform:translateY(14px);animation:fadeUp 800ms cubic-bezier(.16,1,.3,1) 650ms forwards;transition:opacity 180ms ease,transform 180ms ease,border-color 180ms ease}
    .portfolio:hover{opacity:.65;transform:translateX(4px)}
    @keyframes titleIn{from{opacity:0;transform:translateY(28px) scale(.985);letter-spacing:-.045em}to{opacity:1;transform:translateY(0) scale(1);letter-spacing:-.055em}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:.8;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){h1,.bio,.portfolio{animation:none;opacity:1;transform:none}}
    @media (max-width:600px){main{width:88vw}h1{font-size:clamp(3.5rem,18vw,7rem)}.portfolio{margin-top:3rem}}
  </style>
</head>
<body>
  <main>
    <h1 aria-label="Priya Marwaha">
      <span class="name-letter">P</span><span class="name-letter">r</span><span class="name-letter">i</span><span class="name-letter">y</span><span class="name-letter">a</span><br>
      <span class="name-letter">M</span><span class="name-letter">a</span><span class="name-letter">r</span><span class="name-letter">w</span><span class="name-letter">a</span><span class="name-letter">h</span><span class="name-letter">a</span>
    </h1>
    <p class="bio">UI/UX and digital designer focused on creating thoughtful, intuitive, and visually engaging digital experiences. I combine user-centered design with strong visual systems to turn ideas into clear, polished, and purposeful products.</p>
    <a class="portfolio" href="https://dribbble.com/ghostlyy1123" target="_blank" rel="noopener noreferrer" aria-label="Visit Priya Marwaha's portfolio">My portfolio</a>
  </main>

  <script>
    const letters = [...document.querySelectorAll('.name-letter')];
    const pixelCanvases = [];

    function setupLetter(letter, index) {
      const canvas = document.createElement('canvas');
      canvas.className = 'pixel-letter';
      canvas.setAttribute('aria-hidden', 'true');
      letter.appendChild(canvas);
      pixelCanvases.push({ letter, canvas, index, lastLevel: -1 });
    }

    letters.forEach(setupLetter);

    function seededRandom(seed) {
      let value = seed >>> 0;
      return () => {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }

    function renderLetter(item, proximity) {
      const { letter, canvas } = item;
      const rect = letter.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      // Leave the real text visible and crisp by default; only show the canvas near the pointer.
      if (proximity <= 0.05) {
        canvas.style.opacity = '0';
        item.lastLevel = 0;
        return;
      }

      const level = Math.round(proximity * 8);
      if (item.lastLevel === level) return;
      item.lastLevel = level;

      const style = getComputedStyle(letter);
      const pixelSize = Math.max(1, Math.round(1 + proximity * 8));
      const width = Math.max(1, Math.ceil(rect.width / pixelSize));
      const height = Math.max(1, Math.ceil(rect.height / pixelSize));
      canvas.width = width;
      canvas.height = height;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      canvas.style.opacity = String(Math.min(0.8, proximity * 1.15));

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#fff';
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
      const fontSize = parseFloat(style.fontSize) || rect.height;
      ctx.font = style.fontStyle + ' ' + style.fontWeight + ' ' + (fontSize / pixelSize) + 'px ' + style.fontFamily;
      ctx.fillText(letter.textContent, 0, (rect.height * 0.82) / pixelSize);
    }

    let pointerX = -10000, pointerY = -10000;
    function updatePixelation() {
      pixelCanvases.forEach((item) => {
        const rect = item.letter.getBoundingClientRect();
        const dx = pointerX - (rect.left + rect.width / 2);
        const dy = pointerY - (rect.top + rect.height / 2);
        const distance = Math.hypot(dx, dy);
        const radius = 190;
        const proximity = Math.max(0, 1 - distance / radius);
        renderLetter(item, proximity);
      });
    }

    window.addEventListener('mousemove', (event) => {
      pointerX = event.clientX;
      pointerY = event.clientY;
      updatePixelation();
    }, { passive: true });

    window.addEventListener('resize', () => {
      pixelCanvases.forEach((item) => { item.lastLevel = -1; });
      updatePixelation();
    }, { passive: true });
    window.addEventListener('load', updatePixelation);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        pixelCanvases.forEach((item) => { item.lastLevel = -1; });
        updatePixelation();
      });
    }
    updatePixelation();
  </script>
</body>
</html>
